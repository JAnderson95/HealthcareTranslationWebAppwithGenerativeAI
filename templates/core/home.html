<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
{% extends 'core/base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <h1 class="display-4 mb-4"> Healthcare Translator</h1>
        <p class="lead">Real time translation for healthcare patients AI implementation</p>
        {% if not user.is_authenticated %}
        <div class="d-grid gap-2 d-sm-flex justify-content-center mt-4">
            <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-lg px-4 gap-3">Sign up</a>
            <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary btn-lg px-4"> Sign In</a>
        </div>
        {% else %}
        <div class="mt-4">
            <a href="{% url 'translation:translate' %}" class="btn btn-primary btn-lg"> Go to the translator</a>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
</body>
</html>
